# Alembic of the chassis tests. It owns only the shared tables, which the
# reusable revision is tested against.
[alembic]
# %(here)s: the paths resolve against this file, not against the directory
# alembic happens to be started from -- the Job, the script and the tests all
# run it from somewhere else.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
