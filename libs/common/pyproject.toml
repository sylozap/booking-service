[project]
name = "barber-common"
version = "0.1.0"
description = "Shared chassis for the barber platform services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "greenlet==3.5.5",
    "httpx==0.28.1",
    "aiokafka==0.14.0",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-httpx==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-instrumentation-redis==0.65b0",
    "alembic==1.18.1",
    # Verifying the access tokens auth issues. Every service checks the
    # signature itself against the keys from JWKS rather than trusting a
    # header the gateway set (ADR-0010), so this belongs in the chassis and
    # not in one service. The crypto extra brings cryptography, which turns a
    # published JWK back into a key object.
    "pyjwt[crypto]==2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barber_common"]
