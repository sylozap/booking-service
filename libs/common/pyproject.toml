[project]
name = "barber-common"
version = "0.1.0"
description = "Shared chassis for the barber platform services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "greenlet==3.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barber_common"]
