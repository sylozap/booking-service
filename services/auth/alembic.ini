# Migrations of the auth database. The DSN is not in this file: it is in git
# and the password is not. It comes from DATABASE_DSN, read by the shared
# environment in barber_common.db.alembic_env.
[alembic]
# %(here)s: the paths resolve against this file, not against the directory
# alembic happens to be started from -- the Job, the script and the tests all
# run it from somewhere else.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
