# The observability profile, deliberately empty until stage Э7.
#
# Prometheus, Grafana, Tempo, Loki and Alloy are added by T7.1 and T7.4. The
# file exists now so the command that starts them is already the documented one
# and does not change later:
#
#   docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
#
# Everything a service needs on its side is already in place: /metrics is
# exposed, the logs are JSON on stdout, and OTLP_ENABLED turns the traces on.
services: {}
