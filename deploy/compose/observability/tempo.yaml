# Tempo as one process: receives OTLP from the services, keeps traces on the
# local disk of the container. Nothing survives "make obs-down", by design --
# the same as Kafka and PostgreSQL of the local stack.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# A block is cut at 100 MB or five minutes, whichever comes first. The
# defaults, 500 MB and thirty minutes, keep that much of the traces in memory:
# at the peak load of the platform -- 50 requests a second, a dozen spans each
# -- Tempo outgrew its limit and was OOM-killed over and over.
ingester:
  max_block_bytes: 100000000
  max_block_duration: 5m

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 24h

usage_report:
  reporting_enabled: false
