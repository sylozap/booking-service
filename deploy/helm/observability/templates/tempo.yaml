# Tempo as one process, configured by the file of the compose stack: OTLP in
# on 4317 (gRPC) and 4318 (HTTP), the API for Grafana on 3200, traces on a
# disk that lives as long as the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  tempo.yaml: |-
    {{- .Files.Get "files/tempo.yaml" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    {{- include "observability.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One process owns the directory of traces; two at once would both write it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        {{- include "observability.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/tempo.yaml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # The user of the image; the volume below is made writable for it.
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: tempo
          image: {{ .Values.tempo.image }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          securityContext:
            {{- include "observability.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.tempo.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo
        - name: data
          emptyDir:
            sizeLimit: 2Gi
