# Alloy reads the logs of the pods of the platform through the Kubernetes API
# and pushes them to Loki (files/config.alloy). No DaemonSet and no host
# path: the API serves the logs of every node, which on kind is one node, and
# a pod that mounts the log directory of its node is a pod that reads every
# secret printed there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  labels:
    {{- include "observability.labels" . | nindent 4 }}
data:
  config.alloy: |-
    {{- .Files.Get "files/config.alloy" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels:
    {{- include "observability.labels" . | nindent 4 }}
---
# Reading the pods and their logs, in the namespace of the platform and in no
# other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-logs
  namespace: {{ .Values.logsNamespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-logs
  namespace: {{ .Values.logsNamespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    {{- include "observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Two at once would send every line twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        {{- include "observability.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/config.alloy" | sha256sum }}
    spec:
      serviceAccountName: alloy
      securityContext:
        # The unprivileged user of the image.
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
      containers:
        - name: alloy
          image: {{ .Values.alloy.image }}
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          env:
            - name: LOGS_NAMESPACE
              value: {{ .Values.logsNamespace | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          ports:
            - name: http
              containerPort: 12345
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          securityContext:
            {{- include "observability.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: data
          emptyDir:
            sizeLimit: 256Mi
