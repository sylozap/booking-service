{{- $k := .Values.kafka -}}
{{- $advertised := printf "kafka.%s.svc.cluster.local" .Release.Namespace -}}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        {{- include "infra.labels" . | nindent 8 }}
    spec:
      # Required, not a nicety: the Service "kafka" would otherwise arrive as
      # KAFKA_PORT, KAFKA_SERVICE_HOST and so on, and the image reads every
      # KAFKA_* variable as a broker setting -- KAFKA_PORT stops it outright.
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: {{ $k.image }}
          ports:
            - name: kafka
              containerPort: 9092
          env:
            # KRaft: one node that is both broker and controller. The
            # controller listens on localhost only -- nobody else votes.
            - name: CLUSTER_ID
              value: {{ $k.clusterId | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
            # What clients are told to connect to: the Service, which is this
            # one pod.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://{{ $advertised }}:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            # One node, so nothing can be replicated anywhere.
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: {{ $k.partitions | quote }}
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: {{ $k.autoCreateTopics | quote }}
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS
              value: {{ $k.heap | quote }}
          # The JVM takes a while; the port opens when the broker is up.
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $k.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        # Local by design: the log dies with the pod, and the outbox of every
        # service still holds what was not yet delivered.
        - name: data
          emptyDir: {}
