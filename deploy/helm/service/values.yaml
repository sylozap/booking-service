# Defaults of the service chart. A service overrides them in its own file in
# deploy/helm/values; kind adds deploy/helm/values/local.yaml on top.
#
# The release name is the name of the service: "helm install booking" gives a
# Deployment, a Service and a ConfigMap called booking.

# Overrides the name taken from the release.
nameOverride: ""

image:
  # The image is <registry>/<name>:<tag>. The registry and the tag are shared
  # by the five services and set once per environment; the name is the
  # service's own. All three are required: an image without a tag is
  # "latest", and "latest" makes two clusters run different code under one
  # name.
  registry: ""
  name: ""
  tag: ""
  pullPolicy: IfNotPresent

replicas: 2

# The port uvicorn listens on, fixed by the CMD of the image. Probes, the
# Service and /metrics all go to it.
port: 8000

# Settings that are not secret, put into the ConfigMap of the release and read
# by pydantic-settings. SERVICE_NAME is added from the release name.
env: {}

# The Secret with the variables that are secret -- DATABASE_DSN and the like.
# Not created by this chart: secrets are generated outside git and only
# referenced here. Defaults to "<name>-env"; off for a service with no secrets.
#
# The keys are listed rather than taken wholesale with envFrom: the list is
# the contract the secret generator follows, and a key missing from the
# Secret stops the pod with its name instead of passing unnoticed.
secret:
  enabled: true
  name: ""
  keys: []

# Secrets mounted as files rather than variables, such as the signing key of
# auth. Each entry: secretName, key, mountPath.
secretFiles: []

# Requests and limits are required, for the application and for the migration
# Job alike: a pod without limits can eat the memory of a node and take the
# other pods on it down. Rendering fails when a limit is missing.
resources: {}

# Topics the consumers of this service read. Documentation only: the consumers
# run inside the application process, there is no separate Deployment for them.
consumes: []

# The migration Job, run by a Helm hook before the Deployment is updated
# (ADR-0015). Same image; the command is "alembic upgrade head". A failed
# migration fails the upgrade before a single pod is replaced, and the pods of
# the previous release keep serving.
migrations:
  enabled: false
  # Where alembic.ini of the service lies in the image. Defaults to
  # /app/services/<name>.
  workingDir: ""
  # One retry for a database that blinked; a migration that fails twice is a
  # broken migration, and repeating it changes nothing.
  backoffLimit: 1
  # A migration still running after this has hung on a lock, and the release
  # is better stopped than waiting forever.
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Timings of the probes. The paths are fixed in the template on purpose:
# liveness must never look at a dependency, so it is not a setting.
probes:
  # The application checks the schema version before it serves anything, and
  # the first connection to the database can take a while.
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # The readiness check of the database has a deadline of its own of two
  # seconds (HEALTH_CHECK_TIMEOUT_SECONDS); the timeout here is above it.
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# The budget of a shutdown, in the order it is spent. The grace period of the
# pod is their sum, computed by the template, so the parts cannot outgrow it.
shutdown:
  # The pod keeps serving while its removal from the endpoints reaches every
  # node and every client: the endpoints are updated in parallel with
  # SIGTERM, not before it.
  preStopSeconds: 5
  # How long uvicorn waits for the requests in flight after it stops accepting
  # new ones (UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN). Above the proxy read timeout
  # of the gateway, so a request it still waits for is not cut first here.
  requestsSeconds: 15
  # The lifespan shutdown: consumers finish the message in hand and commit,
  # the relay and the workers stop, the pools close. Bounded by the time one
  # message may take, retries included (30 seconds in EventConsumer).
  backgroundSeconds: 30
  # Headroom before SIGKILL.
  marginSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  # The user the Dockerfile creates.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Replicas by CPU, for the services whose load comes and goes with traffic.
# When on, "replicas" above is not written into the Deployment: the
# autoscaler owns the count, and an upgrade must not reset what it decided.
hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  # Of the CPU request. Below 100 so that a new pod has time to start before
  # the ones running are at their limit.
  targetCPUUtilizationPercentage: 70
  # The default of Kubernetes, written out: how long the load has to stay low
  # before pods are removed.
  scaleDownStabilizationSeconds: 300

# Every service is stateless, so every one gets a disruption budget.
pdb:
  enabled: true
  maxUnavailable: 1

# Optional resources. Their templates arrive with the tasks that need them.
serviceMonitor:
  enabled: false
