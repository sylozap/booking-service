# The configuration of the per-service test run of "make type".
#
# mypy refuses two files with the same module name in one run, and every
# service has a tests/test_smoke.py, so service tests are checked one service at
# a time with the same strictness, minus the relaxations allowed for tests.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["libs/common/src"]
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["testcontainers.*", "docker.*", "aiokafka.*"]
ignore_missing_imports = true
